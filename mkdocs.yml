site_name: Exploration Drone Project Manny Datasheet
site_url: https://mcastr11-collab.github.io/EGR314MannyDataSheet/
repo_url: https://github.com/mcastr11-collab/EGR314MannyDataSheet
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: cyan
    accent: blue
  font:
    text: Roboto
  logo: static/logo314.svg
  favicon: static/logo314.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow    
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer
#    - navigation.sections
#    - navigation.expand
#    - navigation.instant # doesn't work that well

markdown_extensions:
  - attr_list #add attributes using curly brackets to images, see https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html # see https://squidfunk.github.io/mkdocs-material/reference/images/
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**
  
plugins:
  - search
  - glightbox # allow resize images, see https://squidfunk.github.io/mkdocs-material/reference/images/

extra_css:
  - stylesheets/extra.css  

extra_javascript:
 - javascripts/mathjax.js
 - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    
not_in_nav: |
  static
  
copyright: "Copyright &copy; 2026 Manuel Castro"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2026_spring
      name: 2023 Site    
nav:
  - Home: index.md
  - 01 Requirements: 01-Requirements/Requirements.md
  - 02 Block Diagram: 02-Block-Diagram/Block-Diagram.md
  - 03 Component Selection: 03-Component-Selection/index.md
  - 04 BOM: 04-BOM/BOM.md
  - 05 Microcontroller Selection: 05-Microcontroller Selection/index.md
  - 06 Power Budget: 06-Power Budget/Power-Budget.md
  - 07 PCB: 07-PCB/index.md
  - 08 Schematic: 08-Schematic/schematic.md
  - 09 API: 09-API/API.md
  - 10 Reflection: 10-Reflection/Reflection.md
  - 11 Hardware V2: 11-Hardware-V2/Hardware.md
  